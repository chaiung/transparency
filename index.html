<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖片顏色去背與透明度調整工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 棋盤格背景（僅用於編輯區表示透明度，不會存入下載的PNG中） */
    .checkerboard-bg {
      background-color: #ffffff;
      background-image: 
        linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
        linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col">

  <!-- 頂部標題區 -->
  <header class="bg-white border-b border-slate-200 px-6 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        圖片顏色去背與透明度調整工具
      </h1>
      <span class="text-xs bg-indigo-50 text-indigo-700 font-medium px-2.5 py-1 rounded-full border border-indigo-200">100% 本地處理 · 隱私安全</span>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- 左側工具面板 -->
    <div class="lg:col-span-1 space-y-6 bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between overflow-y-auto max-h-[calc(100vh-100px)]">
      <div class="space-y-5">
        
        <!-- 步驟 1: 上傳圖片 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">1. 上傳圖片檔</label>
          <label id="uploadArea" class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-slate-300 rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 hover:border-indigo-400 transition-all text-center p-3">
            <svg class="w-7 h-7 text-slate-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <span class="text-xs text-slate-600 font-medium">點擊或拖曳上傳圖片</span>
            <span class="text-[10px] text-slate-400 mt-0.5">支援 PNG, JPG, WEBP 等格式</span>
            <input type="file" id="imageInput" accept="image/*" class="hidden">
          </label>
        </div>

        <hr class="border-slate-100">

        <!-- 步驟 2: 已選取顏色資訊 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">2. 點選要調整的顏色</label>
          <div class="flex items-center gap-3 p-2.5 bg-slate-50 rounded-lg border border-slate-200">
            <div id="selectedColorBox" class="w-9 h-9 rounded border border-slate-300 shadow-inner flex-shrink-0" style="background-color: #ffffff;"></div>
            <div class="text-xs">
              <div class="font-medium text-slate-700" id="colorHexText">未選擇色彩</div>
              <div class="text-slate-400 text-[11px]" id="colorRgbText">請在右側畫布點擊圖像</div>
            </div>
          </div>
        </div>

        <!-- 步驟 3: 容許度/相似度調校 -->
        <div>
          <div class="flex justify-between text-sm font-semibold text-slate-700 mb-1">
            <span>色彩選擇容許度 (Tolerance)</span>
            <span id="toleranceVal" class="text-indigo-600 font-mono">20</span>
          </div>
          <input type="range" id="toleranceInput" min="0" max="150" value="20" class="w-full accent-indigo-600 cursor-pointer">
          <p class="text-[11px] text-slate-400 mt-1">值越高越能將近色/邊緣邊界一併涵蓋。</p>
        </div>

        <!-- 步驟 4: 透明度控制與套用 -->
        <div>
          <div class="flex justify-between text-sm font-semibold text-slate-700 mb-1">
            <span>目標顏色透明度 (Opacity)</span>
            <span id="opacityVal" class="text-indigo-600 font-mono">0% (完全透明)</span>
          </div>
          <input type="range" id="opacityInput" min="0" max="100" value="0" class="w-full accent-indigo-600 cursor-pointer">
          
          <!-- 套用步驟按鈕 -->
          <button id="addRuleBtn" disabled class="mt-3 w-full py-2 px-3 bg-indigo-50 hover:bg-indigo-100 disabled:bg-slate-100 disabled:text-slate-400 disabled:border-slate-200 text-indigo-700 font-medium text-xs rounded-lg border border-indigo-200 transition-all flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            ＋ 套用此色彩處理步驟
          </button>
        </div>

        <hr class="border-slate-100">

        <!-- 步驟 5: 已套用的步驟清單 -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-semibold text-slate-700">3. 已處理色彩清單</label>
            <span id="ruleCountBadge" class="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-mono">0 個步驟</span>
          </div>
          <div id="ruleList" class="space-y-2 max-h-36 overflow-y-auto pr-1 text-xs">
            <div class="text-slate-400 text-center py-4 bg-slate-50 rounded-lg border border-dashed border-slate-200">
              尚無處理步驟<br>請選擇顏色並點擊上方「＋」按鈕
            </div>
          </div>
        </div>

      </div>

      <!-- 步驟 6: 下載與重置按鈕 -->
      <div class="pt-4 border-t border-slate-100 space-y-2">
        <button id="downloadBtn" disabled class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium text-sm rounded-lg shadow-sm transition-all flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          下載透明 PNG 圖檔
        </button>
        <button id="resetBtn" disabled class="w-full py-1.5 text-xs text-slate-500 hover:text-red-600 disabled:text-slate-300 transition-colors">
          清空步驟並還原原圖
        </button>
      </div>

    </div>

    <!-- 右側預覽 canvas 區域 -->
    <div class="lg:col-span-3 bg-white p-4 md:p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-slate-700 flex items-center gap-2">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          圖片預覽視窗 (點擊圖片即可選色)
        </h2>
        <span id="imgDimensions" class="text-xs text-slate-400 font-mono">尚未載入圖片</span>
      </div>

      <!-- Canvas 容器區 (包含棋盤背景與預覽) -->
      <div class="flex-1 w-full min-h-[450px] border border-slate-200 rounded-lg overflow-auto flex items-center justify-center p-4 checkerboard-bg relative">
        <canvas id="previewCanvas" class="max-w-full h-auto cursor-crosshair shadow-md rounded transition-all"></canvas>
        
        <!-- 未上傳圖片時的提示遮罩 -->
        <div id="placeholderText" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-slate-50/90 backdrop-blur-sm pointer-events-none transition-opacity">
          <svg class="w-12 h-12 mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <p class="text-sm font-medium">請從左側上傳圖片開始編輯</p>
        </div>
      </div>
    </div>

  </main>

  <script>
    // DOM 元素引用
    const imageInput = document.getElementById('imageInput');
    const uploadArea = document.getElementById('uploadArea');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const placeholderText = document.getElementById('placeholderText');
    const imgDimensions = document.getElementById('imgDimensions');
    
    const selectedColorBox = document.getElementById('selectedColorBox');
    const colorHexText = document.getElementById('colorHexText');
    const colorRgbText = document.getElementById('colorRgbText');
    
    const toleranceInput = document.getElementById('toleranceInput');
    const toleranceVal = document.getElementById('toleranceVal');
    const opacityInput = document.getElementById('opacityInput');
    const opacityVal = document.getElementById('opacityVal');
    
    const addRuleBtn = document.getElementById('addRuleBtn');
    const ruleList = document.getElementById('ruleList');
    const ruleCountBadge = document.getElementById('ruleCountBadge');

    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    // 全域狀態變數
    let originalImageData = null; // 原始圖片數據 (備份用)
    let currentTargetColor = null; // 當前選取的 RGB 顏色
    let colorRules = [];          // 已套用的色彩處理規則清單 [{ color: [r,g,b], tolerance: n, opacity: n, hex: string }]

    // 拖拽上傳功能
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('border-indigo-500', 'bg-indigo-50'); });
    uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('border-indigo-500', 'bg-indigo-50'); });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('border-indigo-500', 'bg-indigo-50');
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    // 讀取上傳圖片檔案
    function handleFile(file) {
      if (!file.type.startsWith('image/')) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          
          originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          
          placeholderText.classList.add('opacity-0');
          setTimeout(() => placeholderText.style.display = 'none', 200);
          imgDimensions.textContent = `${img.width} × ${img.height} px`;
          downloadBtn.disabled = false;
          resetBtn.disabled = false;
          
          // 重置狀態與規則
          colorRules = [];
          currentTargetColor = null;
          updateColorDisplay(null);
          renderRulesUI();
          applyAllRules();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 點選 Canvas 取得色彩
    canvas.addEventListener('click', (e) => {
      if (!originalImageData) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      // 固定從原始圖片資料讀取真實 RGB 色彩
      const index = (y * canvas.width + x) * 4;
      const r = originalImageData.data[index];
      const g = originalImageData.data[index + 1];
      const b = originalImageData.data[index + 2];

      currentTargetColor = [r, g, b];
      updateColorDisplay(currentTargetColor);
      addRuleBtn.disabled = false;

      // 即時顯示預覽（包含尚未加入步驟的當前設定）
      applyAllRules();
    });

    // 更新選取色彩顯示 UI
    function updateColorDisplay(color) {
      if (!color) {
        selectedColorBox.style.backgroundColor = '#ffffff';
        colorHexText.textContent = '未選擇色彩';
        colorRgbText.textContent = '請在右側畫布點擊圖像';
        addRuleBtn.disabled = true;
        return;
      }
      const [r, g, b] = color;
      const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;
      selectedColorBox.style.backgroundColor = hex;
      colorHexText.textContent = hex;
      colorRgbText.textContent = `RGB(${r}, ${g}, ${b})`;
    }

    // 數值輸入框調整監聽
    toleranceInput.addEventListener('input', (e) => {
      toleranceVal.textContent = e.target.value;
      if (currentTargetColor) applyAllRules();
    });

    opacityInput.addEventListener('input', (e) => {
      const val = e.target.value;
      opacityVal.textContent = `${val}% ${val == 0 ? '(完全透明)' : val == 100 ? '(不透明)' : ''}`;
      if (currentTargetColor) applyAllRules();
    });

    // 點擊新增規則按鈕
    addRuleBtn.addEventListener('click', () => {
      if (!currentTargetColor) return;

      const [r, g, b] = currentTargetColor;
      const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;

      colorRules.push({
        id: Date.now(),
        color: [...currentTargetColor],
        hex: hex,
        tolerance: parseInt(toleranceInput.value, 10),
        opacity: parseInt(opacityInput.value, 10)
      });

      // 清除目前點選色彩，準備下一步選色
      currentTargetColor = null;
      updateColorDisplay(null);
      
      renderRulesUI();
      applyAllRules();
    });

    // 渲染已儲存規則 UI 列表
    function renderRulesUI() {
      ruleCountBadge.textContent = `${colorRules.length} 個步驟`;

      if (colorRules.length === 0) {
        ruleList.innerHTML = `
          <div class="text-slate-400 text-center py-4 bg-slate-50 rounded-lg border border-dashed border-slate-200">
            尚無處理步驟<br>請選擇顏色並點擊上方「＋」按鈕
          </div>`;
        return;
      }

      ruleList.innerHTML = colorRules.map((rule, idx) => `
        <div class="flex items-center justify-between p-2 bg-slate-50 border border-slate-200 rounded-lg">
          <div class="flex items-center gap-2">
            <span class="w-4 h-4 text-[10px] font-bold bg-slate-200 text-slate-600 rounded-full flex items-center justify-center">${idx + 1}</span>
            <div class="w-5 h-5 rounded border border-slate-300 shadow-inner" style="background-color: ${rule.hex}"></div>
            <div>
              <div class="font-mono font-medium text-slate-700 text-[11px]">${rule.hex}</div>
              <div class="text-[10px] text-slate-400">容許度: ${rule.tolerance} | 透明度: ${rule.opacity}%</div>
            </div>
          </div>
          <button onclick="removeRule(${rule.id})" class="p-1 text-slate-400 hover:text-red-500 rounded transition-colors" title="刪除此步驟">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      `).join('');
    }

    // 刪除個別步驟
    window.removeRule = function(id) {
      colorRules = colorRules.filter(r => r.id !== id);
      renderRulesUI();
      applyAllRules();
    };

    // 重置全部步驟
    resetBtn.addEventListener('click', () => {
      if (!originalImageData) return;
      colorRules = [];
      currentTargetColor = null;
      updateColorDisplay(null);
      renderRulesUI();
      ctx.putImageData(originalImageData, 0, 0);
    });

    // 核心處理：依序套用所有規則與當前試算設定
    function applyAllRules() {
      if (!originalImageData) return;

      const workingImageData = new ImageData(
        new Uint8ClampedArray(originalImageData.data),
        originalImageData.width,
        originalImageData.height
      );

      const data = workingImageData.data;

      // 組合所有已儲存的規則 + 當前正在選取調校的臨時規則
      const activeRules = [...colorRules];

      if (currentTargetColor) {
        activeRules.push({
          color: currentTargetColor,
          tolerance: parseInt(toleranceInput.value, 10),
          opacity: parseInt(opacityInput.value, 10)
        });
      }

      if (activeRules.length === 0) {
        ctx.putImageData(originalImageData, 0, 0);
        return;
      }

      // 逐像素依序套用規則
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        for (const rule of activeRules) {
          const [tr, tg, tb] = rule.color;
          const distance = Math.sqrt((r - tr) ** 2 + (g - tg) ** 2 + (b - tb) ** 2);

          if (distance <= rule.tolerance) {
            data[i + 3] = Math.round((rule.opacity / 100) * 255);
            break; // 匹配到第一個規則即執行並換下一像素
          }
        }
      }

      ctx.putImageData(workingImageData, 0, 0);
    }

    // 下載 PNG
    downloadBtn.addEventListener('click', () => {
      if (!originalImageData) return;

      const dataURL = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `multi_step_transparent_${Date.now()}.png`;
      link.href = dataURL;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
